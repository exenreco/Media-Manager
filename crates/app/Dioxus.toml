[application]
name = "Media Manager"
default_platform = "desktop"
android_main_activity = "android/MainActivity.kt"
android_manifest = "android/AndroidManifest.xml"

[android]
min_sdk = 24
compile_sdk = 36
target_sdk = 36
gradle_dependencies = [
    "org.videolan.android:libvlc-all:3.7.5",
    "com.journeyapps:zxing-android-embedded:4.3.0",
    "com.google.android.gms:play-services-ads:25.5.0",
    "com.google.android.ump:user-messaging-platform:4.0.0",
]

[bundle]
identifier = "com.tvshowmanager.app"
publisher = "Media Manager"

[ios]
