[package]
name = "tv-manager-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:rfd"]
mobile = ["dioxus/mobile"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["time", "fs", "io-util"] }
tv-manager-core.workspace = true
dioxus = { version = "0.7.3", features = ["router"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
uuid = { version = "1", features = ["serde"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "ios")'.dependencies]
manganis = "=0.7.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "4.18"
ring = "0.17"
semver = "1"
rfd = { version = "0.15", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tv-manager-server]
path = "../server"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
