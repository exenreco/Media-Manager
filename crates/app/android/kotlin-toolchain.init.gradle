// Dioxus 0.7.10 generates Kotlin 2.0.20, while Google Ads 25.5.0 uses
// Kotlin 2.3 metadata. Upgrade the build plugin rather than bypassing
// metadata validation. Migrate the generated JVM-target DSL at configuration
// time because kotlinOptions is an error in Kotlin 2.3.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        def iconPath = System.getenv('MEDIA_MANAGER_ANDROID_ICONS')
        if (!iconPath || !new File(iconPath).isDirectory()) {
            throw new GradleException('Set MEDIA_MANAGER_ANDROID_ICONS to assets/branding/icons/android')
        }
        def android = project.extensions.getByName('android')
        android.sourceSets.getByName('main').res.srcDir(iconPath)
        if (System.getenv('MEDIA_MANAGER_PLAY_BUNDLE') == 'true') {
          project.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
            androidDsl.defaultConfig.versionCode = (System.getenv('MEDIA_MANAGER_VERSION_CODE') ?: '1000003').toInteger()
            androidDsl.defaultConfig.versionName = '1.0.0-beta.3'
            androidDsl.defaultConfig.ndk.abiFilters.clear()
            androidDsl.defaultConfig.ndk.abiFilters.add('arm64-v8a')
            androidDsl.buildTypes.getByName('release').signingConfig = null
            androidDsl.buildTypes.getByName('release').debuggable = false
          }
        }
    }
    if (project.buildFile.name.endsWith('.gradle.kts') && project.buildFile.exists()) {
        def original = project.buildFile.getText('UTF-8')
        def migrated = original.replaceAll(/(?s)\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}/, '\n')
        if (migrated != original) {
            migrated += '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }\n'
            project.buildFile.setText(migrated, 'UTF-8')
        }
    }
    project.buildscript.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == 'org.jetbrains.kotlin' &&
                dependency.requested.name == 'kotlin-gradle-plugin') {
                dependency.useVersion('2.3.20')
                dependency.because('Google Mobile Ads 25.5.0 requires Kotlin 2.3 metadata support')
            }
        }
    }
}
