name: Platform releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string
      platform:
        description: Platform to rebuild
        required: true
        default: all
        type: choice
        options: [all, desktop, windows, linux-runtime, android, ios]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}-${{ github.event.inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  MEDIA_MANAGER_PLAY_PUBLIC_KEY: ${{ vars.PLAY_BILLING_PUBLIC_KEY }}
  MEDIA_MANAGER_AD_FREE_PRODUCT: ${{ vars.AD_FREE_PRODUCT_ID }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate version tag
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml'
          PY
      - name: Create staging release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Media Manager ${RELEASE_TAG}" --notes-file docs/RELEASE_NOTES.md
          fi

  desktop:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out current packaging tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release -p tv-manager-app -p tv-manager-server --locked
      - name: Package desktop app and server
        shell: bash
        run: python .release-tools/scripts/package_desktop.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --version "${RELEASE_TAG#v}"
      - name: Build native installer
        shell: bash
        run: python .release-tools/scripts/package_installer.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.pkg
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
      - name: Attach release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.pkg dist/*.deb dist/*.sha256)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  windows:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'windows'
    runs-on: windows-latest
    environment: windows-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out current packaging tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release -p tv-manager-app -p tv-manager-server --locked
      - name: Validate signing configuration
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($taskName in @('SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($taskName))) { throw "Signing configuration is missing $taskName" }
          }
      - name: Sign in to Azure using OIDC
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign both Windows executables
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\tv-manager-app.exe
            ${{ github.workspace }}\target\release\tv-manager-server.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
          exclude-interactive-browser-credential: true
      - name: Verify signatures and package
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          Copy-Item .release-tools/scripts/package_desktop.py scripts/package_desktop.py -Force
          Copy-Item .release-tools/scripts/verify_windows_signatures.ps1 scripts/verify_windows_signatures.ps1 -Force
          $taskArguments = @('scripts/package_desktop.py','--platform','windows','--arch','x86_64','--version',$env:RELEASE_TAG.Substring(1))
          if ($env:SIGNING_ENABLED -eq 'true') { $taskArguments += '--require-windows-signature' }
          python @taskArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        run: |
          Copy-Item .release-tools/scripts/package_installer.py scripts/package_installer.py -Force
          New-Item -ItemType Directory -Path scripts/installers -Force | Out-Null
          Copy-Item .release-tools/scripts/installers/* scripts/installers/ -Recurse -Force
          & .release-tools/scripts/prepare_windows_installer.ps1
          python scripts/package_installer.py --platform windows --arch x86_64 --version $env:RELEASE_TAG.Substring(1) --iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" --webview-bootstrapper .tools/installer/MicrosoftEdgeWebview2Setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign Windows installer
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
          exclude-interactive-browser-credential: true
      - name: Verify installer and refresh checksum after signing
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          $taskInstallers = @(Get-ChildItem dist -Filter '*-setup.exe' -File)
          if ($taskInstallers.Count -ne 1) { throw 'Expected exactly one built Windows installer' }
          $taskInstaller = $taskInstallers[0]
          if ($env:SIGNING_ENABLED -eq 'true') {
            $taskSignature = Get-AuthenticodeSignature -LiteralPath $taskInstaller.FullName
            if ($taskSignature.Status -ne 'Valid' -or $null -eq $taskSignature.TimeStamperCertificate) { throw 'Installer signature verification failed' }
          }
          $taskHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskInstaller.FullName).Hash.ToLowerInvariant()
          "$taskHash  $($taskInstaller.Name)" | Set-Content -Encoding ascii "$($taskInstaller.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error
      - name: Attach release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskAssets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.zip','.exe','.sha256') } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @taskAssets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-runtime:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'linux-runtime'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out current packaging tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and runtime packaging dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb xdotool dbus-x11 libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install --noninteractive --no-related flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tv-manager-app -p tv-manager-server --locked
      - name: Package against managed GTK and WebKitGTK runtime
        run: |
          cp .release-tools/assets/branding/icons/linux-256.png assets/branding/icons/linux-256.png
          python .release-tools/scripts/package_flatpak.py --version "${RELEASE_TAG#v}"
          flatpak --user install --noninteractive dist/*.flatpak
      - name: Verify app starts in the runtime
        run: |
          xvfb-run -a dbus-run-session -- bash .release-tools/scripts/smoke_flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-managed-runtime
          path: |
            dist/*.flatpak
            dist/*runtime-sources.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.flatpak dist/*runtime-sources.tar.gz dist/*.sha256 --clobber

  android:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    env:
      MEDIA_MANAGER_PLAY_BUNDLE: 'true'
      MEDIA_MANAGER_VERSION_CODE: '1000006'
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'none'
      RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out packaging tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: bash scripts/install-dioxus.sh
      - name: Configure compatible Kotlin compiler
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home/init.d"
          cp .release-tools/crates/app/android/kotlin-toolchain.init.gradle "$gradle_home/init.d/media-manager-kotlin.gradle"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
          echo "MEDIA_MANAGER_ANDROID_ICONS=$GITHUB_WORKSPACE/assets/branding/icons/android" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build Android release with production ads
        working-directory: crates/app
        run: dx build --release --platform android --target aarch64-linux-android --no-default-features --features mobile
      - name: Build Play bundle and collect unsigned Android packages
        run: |
          project=$(find target/dx -path '*/gradle/wrapper/gradle-wrapper.properties' -print -quit)
          test -n "$project"
          project="${project%/gradle/wrapper/gradle-wrapper.properties}"
          (cd "$project" && bash ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease)
          mkdir -p dist target/android-signing-tools
          apk=$(find target/dx -path '*/outputs/apk/release/*.apk' -type f | head -n 1)
          bundle=$(find target/dx -path '*/outputs/bundle/release/*.aab' -type f | head -n 1)
          test -n "$apk"
          test -n "$bundle"
          cp "$apk" "dist/Media-Manager-${RELEASE_TAG#v}-android-arm64-unsigned.apk"
          cp "$bundle" "dist/Media-Manager-${RELEASE_TAG#v}-android-arm64-unsigned.aab"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" target/android-signing-tools/
          python scripts/export_android_symbols.py dist/*.aab --target target --ndk "$ANDROID_NDK_HOME" --output dist/native-debug-symbols.zip
          python scripts/verify_android_bundle.py dist/*.aab
          cd dist
          sha256sum *.apk *.aab *.zip > android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: target/android-signing-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-unsigned
          path: dist/*
          if-no-files-found: error
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  ios:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out packaging tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/install-dioxus.sh
      - uses: Swatinem/rust-cache@v2
      - name: Build iOS Simulator preview with test ads
        working-directory: crates/app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: dx build --platform ios --target aarch64-apple-ios-sim --no-default-features --features mobile
      - name: Embed SDKs, sign simulator bundle and archive
        run: |
          mkdir -p dist
          app=$(find target/dx -type d -name '*.app' | head -n 1)
          artifacts=$(find target -type d -path '*/mediamanagerads/.build/artifacts' | head -n 1)
          test -n "$app" && test -n "$artifacts"
          python3 .release-tools/crates/app/ios/embed_ad_frameworks.py --app "$app" --artifacts "$artifacts" --sdk iphonesimulator --arch arm64 --identity -
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Media-Manager-${RELEASE_TAG#v}-ios-arm64-simulator.zip"
          cd dist
          shasum -a 256 *.zip > ios-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-simulator
          path: dist/*
          if-no-files-found: error
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  update-metadata:
    needs: [desktop, windows, linux-runtime]
    if: ${{ always() && !cancelled() && vars.UPDATER_ENABLED == 'true' && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'windows' || inputs.platform == 'linux-runtime') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sign complete desktop update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: python scripts/sign_update_manifest.py --tag "$RELEASE_TAG"
      - name: Publish signed updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/update-metadata/* --clobber
