name: Platform releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string
      platform:
        description: Platform to rebuild
        required: true
        default: all
        type: choice
        options: [all, desktop, android, ios]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}-${{ github.event.inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate version tag
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml'
          PY
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Media Manager ${RELEASE_TAG} (preview)" --notes-file docs/RELEASE_NOTES.md
          fi

  desktop:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release -p tv-manager-app -p tv-manager-server --locked
      - name: Package desktop app and server
        shell: bash
        run: python scripts/package_desktop.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Attach release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  android:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out packaging tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: bash scripts/install-dioxus.sh
      - name: Configure compatible Kotlin compiler
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home/init.d"
          cp .release-tools/crates/app/android/kotlin-toolchain.init.gradle "$gradle_home/init.d/media-manager-kotlin.gradle"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build installable Android preview with test ads
        working-directory: crates/app
        run: dx build --platform android --target aarch64-linux-android --no-default-features --features mobile
      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find target/dx -path '*/outputs/apk/debug/*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" "dist/Media-Manager-${RELEASE_TAG#v}-android-aarch64-preview.apk"
          cd dist
          sha256sum *.apk > android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-aarch64-preview
          path: dist/*
          if-no-files-found: error
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  ios:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out packaging tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/install-dioxus.sh
      - uses: Swatinem/rust-cache@v2
      - name: Build iOS Simulator preview with test ads
        working-directory: crates/app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: dx build --platform ios --target aarch64-apple-ios-sim --no-default-features --features mobile
      - name: Embed SDKs, sign simulator bundle and archive
        run: |
          mkdir -p dist
          app=$(find target/dx -type d -name '*.app' | head -n 1)
          artifacts=$(find target -type d -path '*/mediamanagerads/.build/artifacts' | head -n 1)
          test -n "$app" && test -n "$artifacts"
          python3 .release-tools/crates/app/ios/embed_ad_frameworks.py --app "$app" --artifacts "$artifacts" --sdk iphonesimulator --arch arm64 --identity -
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Media-Manager-${RELEASE_TAG#v}-ios-arm64-simulator.zip"
          cd dist
          shasum -a 256 *.zip > ios-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-simulator
          path: dist/*
          if-no-files-found: error
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
