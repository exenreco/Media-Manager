name: Mobile validation (emulator and simulator)

on:
  push:
    branches: ['codex/mobile-validation-*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate from this workflow revision
        required: true
        default: both
        type: choice
        options: [both, android, ios]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  MEDIA_MANAGER_PLAY_PUBLIC_KEY: ${{ vars.PLAY_BILLING_PUBLIC_KEY }}
  MEDIA_MANAGER_AD_FREE_PRODUCT: ${{ vars.AD_FREE_PRODUCT_ID }}

jobs:
  bridge-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test crates/app/android/tests/*.test.cjs crates/app/tests/mobile-storage.test.cjs
      - run: python -m unittest discover -s crates/app/ios/tests -p 'test_*.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_mobile_*.py'

  android:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'android'
    needs: bridge-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-android
            artifact: android-emulator-launch-evidence
            apk: Media-Manager-emulator.apk
          - target: aarch64-linux-android
            artifact: android-device-build
            apk: Media-Manager-android-arm64.apk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: bash scripts/install-dioxus.sh
      - name: Configure Kotlin and app icons
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home/init.d"
          cp crates/app/android/kotlin-toolchain.init.gradle "$gradle_home/init.d/media-manager-kotlin.gradle"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
          echo "MEDIA_MANAGER_ANDROID_ICONS=$GITHUB_WORKSPACE/assets/branding/icons/android" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build Android APK with test ads
        working-directory: crates/app
        run: dx build --platform android --target ${{ matrix.target }} --no-default-features --features mobile
      - name: Collect the current build
        run: |
          apk=$(find target/dx -path '*/outputs/apk/debug/*.apk' -type f | head -n 1)
          test -n "$apk"
          mkdir -p target/mobile-validation/android
          cp "$apk" target/mobile-validation/android/${{ matrix.apk }}
          echo "SMOKE_APK=$GITHUB_WORKSPACE/target/mobile-validation/android/${{ matrix.apk }}" >> "$GITHUB_ENV"
      - name: Test native purchase receipt signatures
        if: matrix.target == 'x86_64-linux-android'
        run: |
          project=$(find target/dx -name gradlew -type f | head -n 1)
          test -n "$project"
          cd "$(dirname "$project")"
          bash ./gradlew testDebugUnitTest --no-daemon
          test -n "$(find . -name 'TEST-dev.dioxus.main.PlayPurchaseSignatureTest.xml' -type f | head -n 1)"
      - name: Enable KVM for this disposable CI runner
        if: matrix.target == 'x86_64-linux-android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install synthetic playback fixture tools
        if: matrix.target == 'x86_64-linux-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install and launch in Android emulator
        if: matrix.target == 'x86_64-linux-android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            python3 scripts/mobile_smoke.py --platform android --app "$SMOKE_APK" --evidence target/mobile-validation/android
            python3 scripts/android_playback_smoke.py --adb "$ANDROID_HOME/platform-tools/adb" --inline --codec h264 --evidence target/mobile-validation/android/h264-inline
            python3 scripts/android_playback_smoke.py --adb "$ANDROID_HOME/platform-tools/adb" --inline --codec h264-10bit --evidence target/mobile-validation/android/h264-10bit-inline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: target/mobile-validation/android/
          if-no-files-found: warn
          retention-days: 14

  ios:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'ios'
    needs: bridge-checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/install-dioxus.sh
      - uses: Swatinem/rust-cache@v2
      - name: Build iOS Simulator app with test ads
        working-directory: crates/app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: dx build --platform ios --target aarch64-apple-ios-sim --no-default-features --features mobile
      - name: Embed frameworks and sign the simulator app
        run: |
          app=$(find target/dx -type d -name '*.app' | head -n 1)
          artifacts=$(find target -type d -path '*/mediamanagerads/.build/artifacts' | head -n 1)
          test -n "$app" && test -n "$artifacts"
          python3 crates/app/ios/embed_ad_frameworks.py --app "$app" --artifacts "$artifacts" --sdk iphonesimulator --arch arm64 --identity -
          echo "SMOKE_IOS_APP=$GITHUB_WORKSPACE/$app" >> "$GITHUB_ENV"
      - name: Create a disposable iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def read(kind):
              return json.loads(subprocess.check_output(['xcrun','simctl','list',kind,'--json']))[kind]
          runtimes=[r for r in read('runtimes') if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          runtime=max(runtimes,key=lambda r:tuple(int(n) for n in r['version'].split('.')))
          types=[t for t in read('devicetypes') if t['name'].startswith('iPhone')]
          device=subprocess.check_output(['xcrun','simctl','create','Media Manager Validation',next((t['identifier'] for t in types if t['name']=='iPhone 16'),types[-1]['identifier']),runtime['identifier']],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('SMOKE_SIMULATOR='+device+'\n')
          subprocess.check_call(['xcrun','simctl','boot',device])
          subprocess.check_call(['xcrun','simctl','bootstatus',device,'-b'])
          PY
      - name: Install and launch in iOS Simulator
        run: python3 scripts/mobile_smoke.py --platform ios --device "$SMOKE_SIMULATOR" --app "$SMOKE_IOS_APP" --evidence target/mobile-validation/ios
      - name: Archive simulator app for diagnostics
        if: always() && env.SMOKE_IOS_APP != ''
        run: |
          mkdir -p target/mobile-validation/ios
          ditto -c -k --sequesterRsrc --keepParent "$SMOKE_IOS_APP" target/mobile-validation/ios/Media-Manager-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch-evidence
          path: target/mobile-validation/ios/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only the simulator created by this job
        if: always()
        run: |
          if [ -n "${SMOKE_SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$SMOKE_SIMULATOR" || true
            xcrun simctl delete "$SMOKE_SIMULATOR"
          fi
