name: Desktop installer validation
on:
  push:
    branches: ['codex/installer-validation-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: aarch64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils xvfb libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: python -m unittest discover -s scripts/tests
      - run: cargo build --release --locked -p tv-manager-app -p tv-manager-server
      - name: Package portable payload
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          echo "INSTALLER_VERSION=$version" >> "$GITHUB_ENV"
          python scripts/package_desktop.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --version "$version"
      - name: Prepare Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare_windows_installer.ps1
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package_installer.py --platform windows --arch x86_64 --version $env:INSTALLER_VERSION --iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" --webview-bootstrapper .tools/installer/MicrosoftEdgeWebview2Setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows install, upgrade, launch and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_windows_installer.ps1
      - name: Build macOS or Linux installer
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/package_installer.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --version "$INSTALLER_VERSION"
      - name: Test macOS package installation
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg dist/*.pkg -target /
          test -x '/Applications/Media Manager.app/Contents/MacOS/media-manager'
          test -x '/Applications/Media Manager.app/Contents/MacOS/media-manager-server'
          codesign --verify --deep --strict '/Applications/Media Manager.app'
          pkgutil --pkg-info com.tvshowmanager.app.installer
          sudo installer -pkg dist/*.pkg -target /
      - name: Test Linux package installation and launch
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          desktop-file-validate /usr/share/applications/com.tvshowmanager.app.desktop
          test -x /usr/bin/media-manager-server
          xvfb-run -a python scripts/test_installed_app.py /usr/bin/media-manager
          sudo apt-get remove -y media-manager
          test ! -e /usr/bin/media-manager
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.pkg
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
